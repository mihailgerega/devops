# Разворачивается в /opt/app на VM (файлы копирует Ansible).
# Запрос: клиент -> nginx (reverse proxy, порт 80) -> app (nginx со страницей Hello World).
services:
  app:
    image: nginx:1.30-alpine
    restart: unless-stopped
    volumes:
      - ./app/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - app-net
    # Порт наружу не публикуется: app доступен только через proxy

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-net

# Своя сеть: контейнеры находят друг друга по имени сервиса (app),
# и она отделена от сети tf-nginx-net, которую создаёт Terraform
networks:
  app-net:
    name: app-net
    driver: bridge
