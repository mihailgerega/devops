# VM из scripts/vm.sh: QEMU пробрасывает 127.0.0.1:2222 -> VM:22.
# Для другой VM достаточно поменять ansible_host/ansible_port.
[docker_hosts]
devops-vm ansible_host=127.0.0.1 ansible_port=2222

[docker_hosts:vars]
# ubuntu — служебный пользователь cloud-образа, через него делаем первичную настройку
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
